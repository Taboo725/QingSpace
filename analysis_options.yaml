# Static analysis configuration. See https://dart.dev/tools/analysis
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Unused code and dead imports should fail the build, not linger as info.
    unused_import: error
    unused_local_variable: error
    unused_element: error
    dead_code: error
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Correctness
    - always_declare_return_types
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - use_build_context_synchronously

    # Performance — const construction lets Flutter skip whole subtree rebuilds.
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - prefer_final_in_for_each

    # Consistency
    - avoid_redundant_argument_values
    - directives_ordering
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unnecessary_parenthesis
