name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        # analysis_options.yaml escalates unused code and dead code to errors,
        # so a clean run here is the contract.
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # Compares pixels rather than file bytes: PNG encoders differ across
      # Pillow versions and platforms, so a byte diff would fail on a toolchain
      # bump while the artwork is unchanged.
      - name: Check the committed icons match tool/generate_icon.py
        run: |
          python -m pip install --quiet Pillow
          python tool/verify_icon.py

  build:
    name: Build ${{ matrix.target }}
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build apk --debug
          - target: windows
            os: windows-latest
            command: flutter build windows --debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: ${{ matrix.command }}

      # Compiles the installer against the debug output. Catches a broken
      # .iss on every push instead of only when a release is cut.
      - name: Compile Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                                      "$env:ProgramFiles\Inno Setup 6\ISCC.exe" `
                                -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                                        "$env:ProgramFiles\Inno Setup 6\ISCC.exe" `
                                  -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          & $iscc.FullName /DAppVersion=0.0.0-ci `
            /DSourceDir=..\..\build\windows\x64\runner\Debug `
            windows\installer\qingspace.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
