name: Feature request / 功能建议
description: Suggest an addition or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve? / 想解决什么问题？
      description: Describe the situation you run into, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen? / 希望如何实现？
    validations:
      required: false
